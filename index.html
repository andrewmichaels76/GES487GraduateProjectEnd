<!DOCTYPE html>
<html>
<head>
<title>GES487 Tutorial by AJM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@2.2.0/leaflet-side-by-side.min.js"></script>
<style type="text/css">
html, body { margin: 0; padding: 0; height: 100%; }
#tutorialmap { min-height: 100%; }
</style>
</head>
<body>
<div id="tutorialmap"></div>
<script type="text/javascript">
var map = L.map('tutorialmap', {
center: [41.980, -87.717],
zoom: 15,
minZoom: 4
});
var Esri_WorldGrayCanvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
maxNativeZoom: 16,
maxZoom: 19
}).addTo(map);
var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
maxZoom: 19
}).addTo(map);
var slider = L.control.sideBySide(Esri_WorldGrayCanvas, Esri_WorldImagery).addTo(map);
slider._range.addEventListener('mouseover', function () { map.dragging.disable(); });
slider._range.addEventListener('mouseout', function () { map.dragging.enable(); });
</script>
</body>
</html>
